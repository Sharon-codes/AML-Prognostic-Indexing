name: JBCB posthoc paired and biological validation
on:
  push:
    branches: [jbcb-evidence-revision-20261024]
    paths: ['jbcb_revision/posthoc_biology.py', '.github/workflows/jbcb-posthoc.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy scikit-learn
      - name: Patient-paired bootstrap and GSE9476 probe-to-gene check
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -u jbcb_revision/posthoc_biology.py 2>&1 | tee jbcb_revision/posthoc_execution.log
      - name: Persist posthoc numerical outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jbcb_revision/bench_results jbcb_revision/posthoc_execution.log
          git diff --cached --quiet || git commit -m 'Record executed patient-bootstrap and gene-annotation audit'
          git push origin HEAD:jbcb-evidence-revision-20261024
