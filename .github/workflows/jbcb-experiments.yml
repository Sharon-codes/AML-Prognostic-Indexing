name: AML benchmark dataset schema preflight
on:
  push:
    branches: [jbcb-evidence-revision-20261024]
    paths: ['.github/workflows/jbcb-experiments.yml', 'jbcb_revision/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dataset-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas
      - run: python jbcb_revision/inspect_datasets.py
